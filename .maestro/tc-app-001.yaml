# ============================================================
# TC-APP-001 — Verifikasi Koneksi Maestro ke Emulator Android
#
# Buka aplikasi Settings bawaan, pastikan halaman utama tampil,
# lalu navigasi ke halaman "Network & internet".
#
# Tujuan: membuktikan emulator + Maestro jalan sebelum bikin
# test aplikasi sungguhan.
#
# Cara jalan:
#   1. Nyalakan emulator Android
#   2. Jalankan:  maestro test .maestro/tc-app-001.yaml
# ============================================================

appId: com.android.settings
---
# Reset aplikasi dulu biar selalu mulai dari kondisi fresh
- launchApp:
    clearState: true

# Halaman utama Settings kebuka
- assertVisible: "Settings"
- assertVisible: "Network & internet"

# Klik menu Network & internet
- tapOn: "Network & internet"

# Halaman Network & internet kebuka — cek menu khas halaman ini
- assertVisible: "Internet"
- assertVisible: "SIMs"

# Kembali ke halaman utama biar run berikutnya bersih
- back

# ============================================================
# Konfigurasi Maestro — project automated (PKPL 2026)
#
# appId default: aplikasi yang dipakai untuk contoh flow.
#   MiLab2 = aplikasi Flutter contoh yang jadi SUT (System Under Test).
#
# flows: daftar file/folder yang dijalankan kalau kita pakai
#   `maestro test maestro/config.yaml`.
# ============================================================

appId: com.example.Milab2

flows:
  - "flows/**"

# Folder hasil run: screenshot + laporan tiap test case.
# Berguna sebagai bukti pengujian saat laporan praktikum.
testOutputDir: output

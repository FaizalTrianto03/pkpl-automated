# ============================================================
# TC-APP-000 — Cek Koneksi Maestro ke Emulator
#
# TUJUAN
#   Memastikan emulator Android + Maestro CLI sudah terhubung
#   dengan benar SEBELUM menjalankan flow aplikasi sungguhan.
#   Sengaja pakai aplikasi Settings bawaan Android supaya tidak
#   bergantung pada APK apa pun.
#
# PRASYARAT
#   - Emulator Android menyala (cek: adb devices)
#   - Maestro CLI tersedia
#
# EKSPEKTASI
#   Semua langkah berstatus ✅.
#
# CARA JALANKAN
#   maestro test maestro\flows\00_cek_koneksi.yaml
#
# Kalau flow ini GAGAL, jangan lanjut ke flow aplikasi — yang bermasalah
# adalah setup emulator/Maestro, bukan aplikasinya.
# ============================================================

appId: com.android.settings
name: "TC-APP-000 Cek Koneksi Maestro ke Emulator"
---
# Reset biar selalu mulai dari kondisi yang sama
- launchApp:
    clearState: true

- assertVisible: "Settings"
- assertVisible: "Network & internet"

- tapOn: "Network & internet"

# Judul halaman di Android kadang tidak masuk UI hierarchy, jadi yang dicek
# isi halamannya (Internet, SIMs), bukan judulnya.
- assertVisible: "Internet"
- assertVisible: "SIMs"

- back

# ---------- BERSIH-BERSIH ----------
# Tutup Settings di akhir flow. Kalau dibiarkan hidup, Android kadang
# memunculkan dialog "Application Not Responding" (ANR) untuk proses Settings,
# dan dialog itu MENGAMBIL ALIH FOKUS LAYAR — flow berikutnya (TC-APP-001)
# gagal di langkah pertama karena Home MiLab2 tidak pernah terlihat.
- stopApp
- pressKey: Home
